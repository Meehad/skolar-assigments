<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Flexbox Layout</title>
    <link rel="stylesheet" href="style/Assignment_6.css">
</head>
<body>
    <h1>Advanced Flexbox Layout</h1>

    <div class="outer-container">
        <h2>Outer Container</h2>
        <div class="flex-container">
            <div class="flex-item item1">Item 1</div>
            <div class="flex-item item2">Item 2</div>
            <div class="flex-item item3">Item 3</div>
            <div class="flex-item item4">Item 4</div>
            <div class="flex-item item5">Item 5</div>
        </div>
    </div>

    <div class="outer-container">
        <h2>Nested Containers</h2>
        <div class="flex-container wrap">
            <div class="flex-item item1">Item 1</div>
            <div class="flex-item item2">Item 2</div>
            <div class="flex-item item3">Item 3</div>
            <div class="flex-item item4">Item 4</div>
            <div class="flex-item item5">Item 5</div>
            <div class="flex-item item6">Item 6</div>
            <div class="flex-item item7">Item 7</div>
        </div>
    </div>

    <div class="outer-container">
        <h2>Alignment and Order</h2>
        <div class="flex-container align-content">
            <div class="flex-item item1">Item 1</div>
            <div class="flex-item item2">Item 2</div>
            <div class="flex-item item3">Item 3</div>
            <div class="flex-item item4">Item 4</div>
            <div class="flex-item item5">Item 5</div>
        </div>
    </div>
</body>
</html>
