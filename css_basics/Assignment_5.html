<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Basics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #333;
        }
        
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
        }
        
        .item {
            background-color: blue;
            color: white;
            padding: 20px;
            margin: 10px;
            text-align: center;
            flex: 1;
        }
        
        .flex-row {
            flex-direction: row;
        }
        
        .flex-column {
            flex-direction: column;
        }
        
        .justify-center {
            justify-content: center;
        }
        
        .justify-space-around {
            justify-content: space-around;
        }
        
        .align-start {
            align-items: flex-start;
        }
        
        .align-end {
            align-items: flex-end;
        }
    </style>
</head>
<body>
    <h1>Flexbox Basics</h1>

    <div class="section">
        <h2>Row Layout</h2>
        <div class="container flex-row">
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item">Item 3</div>
        </div>
    </div>

    <div class="section">
        <h2>Column Layout</h2>
        <div class="container flex-column">
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item">Item 3</div>
        </div>
    </div>

    <div class="section">
        <h2>Center Items</h2>
        <div class="container justify-center">
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item">Item 3</div>
        </div>
    </div>

    <div class="section">
        <h2>Space Around Items</h2>
        <div class="container justify-space-around">
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item">Item 3</div>
        </div>
    </div>

    <div class="section">
        <h2>Align Items to Start</h2>
        <div class="container flex-column align-start" style="height: 200px;">
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item">Item 3</div>
        </div>
    </div>

    <div class="section">
        <h2>Align Items to End</h2>
        <div class="container flex-column align-end" style="height: 200px;">
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item">Item 3</div>
        </div>
    </div>
</body>
</html>
